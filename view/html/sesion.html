<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicia Sesion</title>
    <link rel="icon" type="image/png" href="../../assets/imagenes/Logo.jpg">
    <link href="../css/style.css" rel="stylesheet">
    <link href="../css/login.css" rel="stylesheet">
</head>

<div id="mensaje-alerta" class="mensaje-alerta"></div>

<script>
    const parametros = new URLSearchParams(window.location.search);
    const error = parametros.get("error");

    const alerta = document.getElementById("mensaje-alerta");

    const mensajes = {
        campos: "⚠️ El correo y la contraseña son obligatorios.",
        correo: "⚠️ El correo electrónico no es válido.",
        credenciales: "⚠️ El correo o la contraseña son incorrectos.",
        inactivo: "⚠️ El usuario se encuentra inactivo.",
        acceso: "⚠️ Acceso no permitido."
    };

    if (error && mensajes[error]) {
        alerta.textContent = mensajes[error];
        alerta.classList.add("mostrar");

        setTimeout(() => {
            alerta.classList.remove("mostrar");
        }, 4000);
    }
</script>

<body class="body">
    <header>
        <nav>
            <div class="bloque">
                <img src="../../assets/imagenes/Logo.jpg" alt="Logo Empanadas la Económica">
                <div class="text-logo">
                    <h1>Empanadas La Económica</h1>
                    <p>Sabor casero, precio justo.</p>
                </div>
            </div>
            <div class="bloque">
                <a href="index.html" class="btn-primary">Inicio</a>
                <a href="nosotros.html" class="btn-primary">Sobre Nosotros</a>
                <a href="contactanos.html" class="btn-primary">Contáctanos</a>
            </div>
            <div class="bloque">
                <a href="registrate.html" class="btn-secondary">Regístrate</a>
                <a href="sesion.html" class="btn-secondary">Inicia Sesión</a>
            </div>
        </nav>
    </header>

    <main class="items-center">
    <form action="../../controller/login.php" method="POST" class="flex-column">

        <div class="flex-column">
            <label for="username">Usuario</label>
            <input type="email"
                class="login-input"
                id="username"
                name="correo"
                placeholder="ejemplo@mail.com"
                required>
        </div>

        <div class="flex-column">
            <label for="password">Contraseña</label>
            <input type="password"
                class="login-input"
                id="password"
                name="password"
                placeholder="Ingresa tu contraseña"
                required>
        </div>

        <button type="submit" class="login-button">Iniciar sesión</button>

    </form>
    </main>

    <footer>
        © 2025 Empanadas la Económica — Todos los derechos reservados
    </footer>
</body>

</html>
